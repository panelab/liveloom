# MediaMTX: receives the streamer's single upload.
#   OBS     → rtmp://<host>:1935/live/<ingest key>        (or SRT on :8890)
#   Browser → https://<host>/whip/live/<ingest key>/whip  (WebRTC/WHIP, via Caddy → :8889)
# Every connection is checked by the relay's /mediamtx/auth hook:
#   publish  → ingest key must exist in the DB
#   read/api → only the relay (user "relay" + RELAY_SECRET)

logLevel: info

authMethod: http
# Overridden in docker-compose via MTX_AUTHHTTPADDRESS
authHTTPAddress: http://127.0.0.1:8787/mediamtx/auth
authHTTPExclude: []

api: yes
apiAddress: :9997

rtmp: yes
rtmpAddress: :1935

srt: yes
srtAddress: :8890

# Internal only (not published by Docker): the relay reads browser streams
# over RTSP because RTMP can't carry Opus audio.
rtsp: yes
rtspAddress: :8554
rtspTransports: [tcp]

# Browser streaming (WHIP). Caddy terminates TLS and proxies /whip/* here.
# Media flows over UDP 8189 (TCP 8189 as a fallback for strict networks).
webrtc: yes
webrtcAddress: :8889
webrtcEncryption: no
webrtcAllowOrigins: ['*']
webrtcLocalUDPAddress: :8189
webrtcLocalTCPAddress: :8189
# The container's own IPs aren't reachable from the internet; advertise the
# public host instead (MTX_WEBRTCADDITIONALHOSTS in docker-compose).
webrtcIPsFromInterfaces: no
webrtcAdditionalHosts: []

hls: no
moq: no

paths:
  all_others:
